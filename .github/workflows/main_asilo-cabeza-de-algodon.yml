name: Deploy Asilo to Azure
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azure-asilo-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CORREO_HABILITADO: 'false'
      MENSUALIDADES_AUTOMATICAS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install from repository root
        run: npm ci
      - name: Test without real SQL or SMTP
        run: npm test
      - name: Package production files
        run: |
          npm prune --omit=dev
          mkdir deploy
          cp package.json package-lock.json deploy/
          cp -R backend frontend node_modules deploy/
          cd deploy
          zip -qr ../release.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: asilo-release
          path: release.zip
          retention-days: 3
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: asilo-release
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: asilo-cabeza-de-algodon
          package: release.zip
          startup-command: 'node backend/server.js'
