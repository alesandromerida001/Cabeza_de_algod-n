<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Reportes | Asilo Cabeza de Algodón</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="reportes.css">
    <link rel="stylesheet" href="/css/cyberdeck.css">
</head>
<body>
    <header><strong>Asilo Cabeza de Algodón</strong><div><button id="salir" type="button">Salir</button></div></header>
    <main class="container-fluid">
        <p class="eyebrow">CONSULTA INSTITUCIONAL // SOLO LECTURA</p>
        <div class="gestion-toolbar"><h1>Centro de Reportes</h1><a id="volver" class="btn btn-secondary" href="/principal/admin_dashboard.html">Volver al menú</a></div>
        <p>Consulta los registros existentes y exporta el mismo resultado a PDF.</p>
        <form id="formReporte" class="panel">
            <div class="row g-3">
                <div class="col-lg-6"><label for="reporte">Reporte</label><select id="reporte" required disabled><option value="">Cargando reportes disponibles…</option></select></div>
                <div id="filtroPaciente" class="col-lg-6 buscador"><label id="etiquetaPaciente" for="paciente">Residente · nombre, apellido o DPI</label><input id="paciente" autocomplete="off" placeholder="Todos los pacientes; escribe para seleccionar uno" aria-controls="sugerencias" aria-describedby="seleccion"><div id="sugerencias" class="sugerencias" hidden></div><small id="seleccion">Todos los pacientes</small><button id="limpiarPaciente" type="button" class="texto-boton">Quitar selección</button></div>
                <div class="col-md-3"><label id="etiquetaDesde" for="desde">Desde *</label><input id="desde" type="date" required></div>
                <div class="col-md-3"><label id="etiquetaHasta" for="hasta">Hasta *</label><input id="hasta" type="date" required></div>
                <div class="col-md-6 herramientas"><button id="consultar" type="submit" class="primario" disabled>Consultar</button><button id="pdf" type="button" disabled>Exportar PDF</button></div>
            </div>
        </form>
        <div id="mensaje" role="status" aria-live="polite" hidden></div>
        <section id="resultado" aria-live="polite"></section>
    </main>
    <script src="/compartido/cyberdeck.js"></script>
    <script src="../compartido/formatos.js"></script>
    <script src="reportes.js"></script>
</body>
</html>
