<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Finanzas | Cabeza de Algodón</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../principal/dashboard.css">
    <link rel="stylesheet" href="finanzas.css">
    <link rel="stylesheet" href="/css/cyberdeck.css">
</head>

<body data-vista="finanzas">
    <header class="dashboard-header">
        <div class="logo-text">Asilo Cabeza de Algodón</div>
        <div class="user-info"><span>Finanzas</span><button id="salir" class="btn-outline" type="button">Salir</button>
        </div>
    </header>
    <main class="gestion-main">
        <div class="gestion-toolbar">
            <h1>Finanzas</h1><a id="volver" class="btn btn-secondary" href="../principal/admin_dashboard.html">← Volver
                al menú</a>
        </div>
        <nav id="navegacion" class="navegacion-finanzas" aria-label="Finanzas"><a class="btn btn-secondary"
                href="finanzas.html" aria-current="page">Finanzas</a><a class="btn btn-secondary"
                href="cuentas.html">Estados de Cuenta</a><a class="btn btn-secondary"
                href="mensualidades.html">Mensualidades</a><a class="btn btn-secondary"
                href="fundacion.html">Obligaciones con Fundación</a><a class="btn btn-secondary"
                href="donaciones.html">Donaciones</a><a class="btn btn-secondary" href="gastos.html">Gastos</a><a
                class="btn btn-secondary" href="notificaciones.html">Notificaciones por correo</a></nav>
        <div id="tarjetas" class="resumen-finanzas"></div>
        <div id="filtros" class="filtros-finanzas"></div>
        <div id="acciones" class="acciones-finanzas"></div>
        <p id="mensaje" class="mensaje-finanzas" role="status" aria-live="polite"></p>
        <div id="contenido" class="contenido-finanzas"></div>
    </main>
    <div class="modal fade" id="modalFinanzas" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="tituloModal" class="modal-title fs-5"></h2><button id="cerrarX" type="button"
                        class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <form id="formFinanzas">
                    <div class="modal-body">
                        <div id="errorModal" role="alert"></div>
                        <div id="camposModal" class="row g-3"></div>
                        <div id="previewModal" class="mt-3"></div>
                    </div>
                    <div class="modal-footer"><button type="button" id="editarPreview" class="btn btn-secondary"
                            hidden>Revisar datos</button><button id="cancelarModal" type="button"
                            class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button><button id="guardarModal"
                            class="btn btn-primary" type="submit">Guardar</button></div>
                </form>
            </div>
        </div>
    </div>
    <script src="/compartido/cyberdeck.js"></script>
    <script src="../compartido/formatos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="finanzas.js"></script>
</body>

</html>
